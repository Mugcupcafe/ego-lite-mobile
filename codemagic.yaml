workflows:
  android-ego-lite-mobile:
    name: ego-lite-mobile v1.0.0.c (Release R8 + Rust arm64-v8a · Free M2)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      groups:
        - ego_signing
      java: 17
      vars:
        PACKAGE_NAME: "com.egolite.mobile"
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
        - ~/.android
        - ~/.rustup
        - ~/.cargo/bin
        - ~/.cargo/registry
        - ~/.cargo/git
        - rust/ego-core-rust/target
    scripts:
      - name: Ensure consistent debug signing keystore (in-place updates)
        script: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          export KEYSTORE_PATH="$HOME/.android/debug.keystore"
          if [ -n "${DEBUG_KEYSTORE_B64:-}" ]; then
            echo "Restoring debug.keystore from DEBUG_KEYSTORE_B64 environment variable..."
            python3 -c 'import base64, os, re; raw = re.sub(r"\s+", "", os.environ["DEBUG_KEYSTORE_B64"]); open(os.environ["KEYSTORE_PATH"], "wb").write(base64.b64decode(raw))'
          elif [ -f "$KEYSTORE_PATH" ]; then
            echo "Reusing cached debug.keystore (in-place APK update supported)."
          else
            echo "Generating new persistent debug.keystore (will be cached for future builds)..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=EgoLiteMobile,C=KR"
          fi
          ls -lh "$KEYSTORE_PATH"

      - name: Download & Android-DNS-patch arm64-v8a tunnel binaries into jniLibs (W^X safe)
        script: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a

          echo "Downloading cloudflared-linux-arm64..."
          curl -fSL -o app/src/main/jniLibs/arm64-v8a/libcloudflared.so \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-arm64
          chmod 755 app/src/main/jniLibs/arm64-v8a/libcloudflared.so

          echo "Downloading ngrok-v3-stable-linux-arm64..."
          curl -fSL -o /tmp/ngrok.tgz \
            https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-arm64.tgz
          tar -xzf /tmp/ngrok.tgz -C /tmp
          mv /tmp/ngrok app/src/main/jniLibs/arm64-v8a/libngrok.so
          chmod 755 app/src/main/jniLibs/arm64-v8a/libngrok.so

          echo "Patching Go DNS path (/etc/resolv.conf -> //proc/self/fd/0) for non-root Android..."
          python3 - << 'PY'
          old = b"/etc/resolv.conf"
          new = b"//proc/self/fd/0"
          assert len(old) == len(new) == 16
          for path in [
              "app/src/main/jniLibs/arm64-v8a/libcloudflared.so",
              "app/src/main/jniLibs/arm64-v8a/libngrok.so",
          ]:
              with open(path, "rb") as f:
                  data = f.read()
              count = data.count(old)
              patched = data.replace(old, new)
              with open(path, "wb") as f:
                  f.write(patched)
              print(f"Patched {path}: {count} occurrence(s) replaced")
          PY
          ls -lh app/src/main/jniLibs/arm64-v8a/

      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Ensure Gradle 8.7 Wrapper JAR is present
        script: |
          set -euo pipefail
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Bootstrapping official Gradle 8.7 wrapper jar (--no-daemon)..."
            curl -fSL -o /tmp/gradle-8.7-bin.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
            unzip -q -o /tmp/gradle-8.7-bin.zip -d /tmp/gradle-dist
            /tmp/gradle-dist/gradle-8.7/bin/gradle --no-daemon wrapper --gradle-version 8.7
            /tmp/gradle-dist/gradle-8.7/bin/gradle --stop || true
            rm -rf /tmp/gradle-8.7-bin.zip /tmp/gradle-dist
          fi
          chmod +x ./gradlew

      - name: Download official Google Material Symbols Rounded variable font
        script: |
          set -euo pipefail
          mkdir -p app/src/main/assets/fonts
          curl -fSL -o app/src/main/assets/fonts/MaterialSymbolsRounded.ttf \
            "https://raw.githubusercontent.com/google/material-design-icons/master/variablefont/MaterialSymbolsRounded%5BFILL%2CGRAD%2Copsz%2Cwght%5D.ttf"
          ls -lh app/src/main/assets/fonts/MaterialSymbolsRounded.ttf

      - name: Build Rust native engine (libego_core.so · arm64-v8a)
        script: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:/opt/homebrew/opt/rustup/bin:/opt/homebrew/bin:$PATH"
          if ! command -v cargo >/dev/null 2>&1; then
            echo "Installing Rust toolchain (Homebrew -> static.rust-lang.org -> sh.rustup.rs fallback)..."
            if command -v brew >/dev/null 2>&1; then
              HOMEBREW_NO_AUTO_UPDATE=1 brew install rustup || HOMEBREW_NO_AUTO_UPDATE=1 brew install rustup-init || true
              export PATH="$(brew --prefix rustup 2>/dev/null || echo /opt/homebrew/opt/rustup)/bin:$HOME/.cargo/bin:$PATH"
            fi
            if command -v rustup-init >/dev/null 2>&1; then
              rustup-init -y --default-toolchain stable --no-modify-path
            elif command -v rustup >/dev/null 2>&1; then
              rustup default stable
            else
              curl --proto '=https' --tlsv1.2 --retry 3 -sSfL -o /tmp/rustup-init                 https://static.rust-lang.org/rustup/dist/aarch64-apple-darwin/rustup-init                 && chmod +x /tmp/rustup-init                 && /tmp/rustup-init -y --default-toolchain stable --no-modify-path                 || curl --proto '=https' --tlsv1.2 --retry 3 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            fi
            export PATH="$HOME/.cargo/bin:/opt/homebrew/opt/rustup/bin:$PATH"
          fi
          rustup target add aarch64-linux-android

          # Locate or install Android NDK clang linker for API 29+ arm64-v8a
          NDK_CLANG=$(ls -1 "$ANDROID_SDK_ROOT"/ndk/*/toolchains/llvm/prebuilt/darwin-*/bin/aarch64-linux-android29-clang 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$NDK_CLANG" ]; then
            echo "Installing Android NDK 26.3.11579264..."
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" >/dev/null
            NDK_CLANG=$(ls -1 "$ANDROID_SDK_ROOT"/ndk/*/toolchains/llvm/prebuilt/darwin-*/bin/aarch64-linux-android29-clang | sort -V | tail -n 1)
          fi
          echo "Using NDK linker: $NDK_CLANG"

          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_CLANG"
          export CC_aarch64_linux_android="$NDK_CLANG"
          (cd rust/ego-core-rust && cargo build --release --target aarch64-linux-android)

          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp rust/ego-core-rust/target/aarch64-linux-android/release/libego_core.so app/src/main/jniLibs/arm64-v8a/libego_core.so
          ls -lh app/src/main/jniLibs/arm64-v8a/libego_core.so

      - name: Build Release APK (R8 Optimized · arm64-v8a)
        script: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          echo "=== Verified APK Signing Certificate SHA-256 ==="
          keytool -printcert -jarfile app/build/outputs/apk/release/app-release.apk | grep -E "Owner:|SHA256:" || true
    artifacts:
      - app/build/outputs/apk/release/*.apk
